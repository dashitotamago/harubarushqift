<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shifly</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .wrap { width: 100%; max-width: 380px; padding: 24px; }
  .logo {
    width: 56px; height: 56px; border-radius: 16px; background: #0d9488; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px;
  }
  h1 { text-align: center; margin: 0 0 4px; font-size: 20px; color: #0f172a; }
  p.sub { text-align: center; color: #94a3b8; font-size: 13px; margin: 0 0 28px; }
  a.card {
    display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 16px; padding: 16px; margin-bottom: 12px; text-decoration: none; color: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  a.card:hover { border-color: #99f6e4; }
  .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .icon.staff { background: #f0fdfa; }
  .icon.admin { background: #f1f5f9; }
  .icon.punch { background: #fffbeb; }
  .title { font-size: 14px; font-weight: 600; color: #1e293b; }
  .desc { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">📅</div>
  <h1>Shifly</h1>
  <p class="sub">シフト管理をシンプルに</p>

  <a class="card" href="staff.html">
    <div class="icon staff">🧑</div>
    <div>
      <div class="title">スタッフとしてログイン</div>
      <div class="desc">自分のシフトを確認・提出</div>
    </div>
  </a>

  <a class="card" href="admin.html">
    <div class="icon admin">🛡️</div>
    <div>
      <div class="title">管理者としてログイン</div>
      <div class="desc">シフト作成・人件費管理</div>
    </div>
  </a>

  <a class="card" href="punch.html">
    <div class="icon punch">📷</div>
    <div>
      <div class="title">打刻する</div>
      <div class="desc">名前を選んで出勤・退勤・休憩を記録</div>
    </div>
  </a>
</div>
</body>
</html>
